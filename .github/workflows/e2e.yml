name: e2e

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/Dockerfile.e2e
          tags: meditaur-e2e:local
          load: true
          cache-from: type=gha,scope=meditaur-e2e
          cache-to: type=gha,mode=max,scope=meditaur-e2e
      - run: MEDITAUR_E2E_SKIP_BUILD=1 ./scripts/e2e.sh
